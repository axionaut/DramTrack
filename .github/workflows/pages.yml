name: Deploy DramTrack to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check web.js
          node --check logic.js
          node --check archive.js
          node logic.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare public assets
        run: |
          mkdir _site
          cp index.html styles.css logic.js web.js archive.js Logo.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
